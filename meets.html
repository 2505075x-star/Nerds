<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大会出場情報 | Jumping Nerds</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#0a0a0a; --grid:#2a2a2a; --ink:#f3f3ec; --muted:#a8a8a0;
  --hl:#ffe14d; --red:#ff7a66; --card:#121212;
  --display:"Bricolage Grotesque","Zen Kaku Gothic New",system-ui,sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--body);color:var(--ink);background:var(--paper);line-height:1.7}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
.back{display:inline-block;margin-top:28px;color:var(--ink);font-size:14px;text-decoration:none;border-bottom:2px solid var(--hl)}
.back:focus-visible,.toolbar button:focus-visible{outline:3px solid var(--red);outline-offset:2px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(36px,7vw,64px);line-height:1.1;margin:20px 0 0}
.sub{color:var(--muted);margin:10px 0 0}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:32px 0 20px;align-items:center}
.toolbar button{font:inherit;font-size:14px;padding:6px 16px;border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;cursor:pointer}
.toolbar button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.count{margin-left:auto;color:var(--muted);font-size:14px}
.list{display:grid;gap:18px;padding-bottom:64px}
.meet{background:var(--card);border:2px solid var(--ink);padding:20px}
.meet header{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;justify-content:space-between}
.meet h2{font-family:var(--display);font-size:24px;margin:0;line-height:1.3}
.date{font-family:var(--display);font-weight:800;font-size:20px;color:var(--red)}
.info{margin:4px 0 14px;font-size:14px;color:var(--muted)}
.badge{display:inline-block;background:var(--hl);color:#14213d;font-size:12px;font-weight:700;padding:2px 10px;margin-right:8px}
.badge.done{background:var(--grid);color:var(--ink)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px;min-width:420px}
th,td{text-align:left;padding:8px 10px;border-top:1px dashed var(--muted)}
th{color:var(--muted);font-weight:400;font-size:13px}
td.res{font-family:var(--display);font-weight:800;font-size:18px;color:var(--red)}
td.res.wait{color:var(--muted);font-family:var(--body);font-weight:400;font-size:14px}
.empty{color:var(--muted);padding:40px 0}
footer{padding:28px 0;border-top:2px solid var(--ink);color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">選手紹介にもどる</a>
  <h1>大会出場情報</h1>
  <p class="sub">これからの大会の出場予定と、終わった大会の結果です。</p>

  <div class="toolbar" id="filters" role="group" aria-label="開催状況で絞り込み">
    <button type="button" data-f="all">すべて</button>
    <button type="button" data-f="upcoming">開催予定</button>
    <button type="button" data-f="done">終了</button>
    <span class="count" id="count"></span>
  </div>
  <div class="list" id="list"></div>
  <footer>© Jumping Nerds Track &amp; Field Club(サンプルデータ・架空の大会です)</footer>
</div>

<script>
// ▼ 大会データ。ここに1大会ずつ足せば自動でカードが増えます。
// date は "YYYY-MM-DD"。今日より前なら自動で「終了」表示になります。
// entries の mark は結果(未確定なら空 "" にすると「結果待ち」と表示)。
const meets = [
  {date:"2026-11-14", name:"秋季記録会", place:"神戸総合運動公園", note:"集合 8:30 / 跳躍は午前",
   entries:[
     {name:"前村 土温", event:"走幅跳", mark:""},
     {name:"乃美 裕介", event:"走幅跳", mark:""},
     {name:"安藤 寛峻", event:"三段跳", mark:""},
     {name:"磯山 福太郎", event:"三段跳", mark:""}
   ]},
  {date:"2026-12-06", name:"冬季ジャンプ競技会", place:"ユニバー記念競技場", note:"",
   entries:[
     {name:"金光 将英", event:"三段跳", mark:""},
     {name:"水野 文由里", event:"走幅跳", mark:""},
     {name:"長谷川 奈穂", event:"走幅跳", mark:""}
   ]},
  {date:"2026-10-11", name:"秋季リーグ戦", place:"ほっともっとフィールド神戸", note:"",
   entries:[
     {name:"前村 土温", event:"走幅跳", mark:"7m21"},
     {name:"乃美 裕介", event:"走幅跳", mark:"7m48"},
     {name:"安藤 寛峻", event:"三段跳", mark:"15m40"},
     {name:"坂口 彰良", event:"三段跳", mark:"14m92"}
   ]}
];

const list = document.getElementById("list");
const count = document.getElementById("count");
const today = new Date().toISOString().slice(0,10);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = d => { const [y,m,day] = d.split("-"); return `${y}.${+m}.${+day}`; };
let current = "all";

function render(){
  const rows = meets
    .map(m => ({...m, done: m.date < today}))
    .filter(m => current === "all" || (current === "done") === m.done)
    .sort((a,b) => a.done === b.done
      ? (a.done ? b.date.localeCompare(a.date) : a.date.localeCompare(b.date))
      : (a.done ? 1 : -1));
  list.innerHTML = rows.length ? rows.map(m => `
    <article class="meet">
      <header>
        <h2><span class="badge ${m.done ? "done" : ""}">${m.done ? "終了" : "開催予定"}</span>${esc(m.name)}</h2>
        <span class="date">${fmt(m.date)}</span>
      </header>
      <p class="info">${esc(m.place)}${m.note ? " / " + esc(m.note) : ""}</p>
      <div class="tbl"><table>
        <thead><tr><th>選手</th><th>種目</th><th>${m.done ? "記録" : "状況"}</th></tr></thead>
        <tbody>${m.entries.map(e => `
          <tr><td>${esc(e.name)}</td><td>${esc(e.event)}</td>
          ${e.mark ? `<td class="res">${esc(e.mark)}</td>` : `<td class="res wait">${m.done ? "結果待ち" : "出場予定"}</td>`}</tr>`).join("")}
        </tbody>
      </table></div>
    </article>`).join("") : `<p class="empty">この条件の大会はまだ登録されていません。</p>`;
  document.querySelectorAll("#filters button").forEach(b =>
    b.setAttribute("aria-pressed", b.dataset.f === current));
  count.textContent = `${rows.length}大会`;
}

document.getElementById("filters").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  current = b.dataset.f;
  render();
});
render();
</script>
</body>
</html>
